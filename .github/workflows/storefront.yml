# Storefront pipeline: push to master -> build & typecheck -> deploy -> verify.
#
# Rendered from hira-cicd/templates/ci-store.yml. The storefront is static, so
# "test" here means the build is reproducible and type-clean; the behavioural
# tests live on the app branches, against a real bench.
name: Storefront

on:
  push:
    branches: [master]
    # Docs and CI metadata cannot change what gets served.
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # vite 6 wants ^18 || ^20 || >=22
          cache: npm

      # `npm ci`, never `npm install`: it honours package-lock.json exactly, so
      # what CI validates is byte-for-byte what the server will install.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Build the same way the server does, so a base-path or catalogue error
      # surfaces here rather than on the shop.
      - name: Build
        run: npm run build:vercel

      - name: Assert the build produced something servable
        run: |
          test -f dist/index.html || { echo "no dist/index.html"; exit 1; }
          grep -q '<div id="root"' dist/index.html || { echo "no React mount point"; exit 1; }
          N=$(find dist/static -name '*.js' | wc -l)
          [ "$N" -ge 2 ] || { echo "only $N js bundles"; exit 1; }
          echo "dist: $(du -sh dist | cut -f1), $N js bundles"

      - name: Audit (advisory)
        run: npm audit --omit=dev || true

      # The catalogue is half the deploy. Products are served from ERPNext, not
      # from the bundle, so shipping dist/ alone leaves the shop showing the old
      # names, categories and prices — which is how a pair of earrings stayed
      # listed as "Nagas Necklace" under Necklaces long after it was corrected
      # here. Handed to the deploy job as an artifact rather than re-read on the
      # server, so the products seeded are exactly the ones this run built and
      # typechecked.
      - name: Hand the catalogue to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: src/data/catalog.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy storefront
    needs: build                      # unreachable unless the build went green
    # workflow_dispatch included deliberately: without it a manual run can only
    # ever build, never deploy - and the case where you most need a manual
    # deploy is commits that were pushed while Actions was disabled, which is
    # exactly how master ended up 22 commits behind production.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, hira-prod]
    timeout-minutes: 20
    concurrency:
      # Shared with the app branches on purpose: verify-store.sh calls the Frappe
      # API, and an app deploy restarts exactly that upstream. Serialising the
      # two stops a storefront verify failing on a backend mid-restart.
      group: deploy-hira-prod
      cancel-in-progress: false

    steps:
      # No checkout: deploy-store.sh owns its own source tree and fetches the
      # precise commit this run was triggered for.
      - name: Deploy @ ${{ github.sha }}
        run: /home/frappe/hira-cicd/bin/deploy-store.sh --ref "${{ github.sha }}"

      # Downloaded into the runner's workspace, not the release tree, so this
      # stays independent of however deploy-store.sh lays its source out.
      - name: Fetch the catalogue built by this run
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: catalog-sync

      # Brings ERPNext's Item records in step with the catalogue just deployed.
      # `seed_catalog` is idempotent — it updates existing products and creates
      # missing ones, never duplicates — so running it on every deploy is the
      # point: the two can no longer drift apart.
      #
      # Override BENCH_PATH / BENCH_SITE as repository variables if the bench
      # ever moves or the site is renamed.
      - name: Sync the catalogue into ERPNext
        env:
          BENCH_PATH: ${{ vars.BENCH_PATH || '/home/frappe/frappe-bench' }}
          BENCH_SITE: ${{ vars.BENCH_SITE }}
        run: |
          set -euo pipefail

          if [ ! -d "$BENCH_PATH/sites" ]; then
            echo "No bench at $BENCH_PATH."
            echo "Set the BENCH_PATH repository variable to the bench directory."
            exit 1
          fi

          SITE="${BENCH_SITE:-}"
          if [ -z "$SITE" ] && [ -f "$BENCH_PATH/sites/currentsite.txt" ]; then
            SITE=$(tr -d '[:space:]' < "$BENCH_PATH/sites/currentsite.txt")
          fi
          if [ -z "$SITE" ]; then
            echo "Could not work out the site name."
            echo "Set the BENCH_SITE repository variable to it."
            exit 1
          fi

          # A runner's shell is not a login shell, so bench is often not on PATH
          # even though it works fine when the frappe user types it.
          BENCH=$(command -v bench || true)
          for c in "$HOME/.local/bin/bench" /home/frappe/.local/bin/bench /usr/local/bin/bench; do
            [ -n "$BENCH" ] && break
            [ -x "$c" ] && BENCH="$c"
          done
          if [ -z "$BENCH" ]; then
            echo "Could not find the bench command."
            echo "Add it to the runner's PATH, or set BENCH_PATH and install bench for that user."
            exit 1
          fi

          cp catalog-sync/catalog.json "$BENCH_PATH/sites/catalog.json"
          echo "seeding $(grep -o '"name"' "$BENCH_PATH/sites/catalog.json" | wc -l) products into $SITE"

          cd "$BENCH_PATH"
          "$BENCH" --site "$SITE" execute hira.api.seed.seed_catalog

      - name: Verify
        run: /home/frappe/hira-cicd/bin/verify-store.sh

      - name: Release state on failure
        if: failure()
        run: |
          ls -1dt /home/frappe/hira-store/releases/*/ | head -5
          readlink -f /home/frappe/hira-store/current
